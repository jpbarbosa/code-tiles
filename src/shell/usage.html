<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Claude usage</title>
  <link rel="stylesheet" href="panel.css" />
  <!-- Its shared half is panel.css; what is here is this panel's own shape. -->
  <style>
    body {
      padding: 12px 14px;
      background: var(--panel);
      user-select: none;
      display: flex;
      flex-direction: column;
      gap: 11px;
    }

    #rows { display: flex; flex-direction: column; gap: 9px; }

    .row { display: flex; flex-direction: column; gap: 4px; }
    .row .head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
    .row .track { position: relative; height: 5px; border-radius: 3px; corner-shape: round; background: rgb(255 255 255 / 0.12); }
    .row .fill { height: 100%; border-radius: 3px; corner-shape: round; }
    /* A unit of the window per segment, an hour or a day, cut through track and fill alike. The
       mark is now, overhanging the track so it reads over a fill too; the two share one formula,
       so a mark on a unit's boundary lands on that gap's pixels. */
    .row .gap, .row .now { position: absolute; left: calc(var(--at) * (100% - 1px)); width: 1px; }
    .row .gap { inset-block: 0; background: var(--panel); }
    .row .now { inset-block: -1px; background: var(--ink); }

    form { display: flex; flex-direction: column; gap: 8px; }
    form .line { display: flex; align-items: center; gap: 7px; }

    input {
      flex: 1 1 auto;
      min-width: 0;
      height: 24px;
      padding: 0 8px;
      border: 1px solid rgb(255 255 255 / 0.18);
      border-radius: calc(6px * var(--corner-scale));
      background: rgb(255 255 255 / 0.06);
      color: inherit;
      font: inherit;
      outline: none;
    }

    input:focus { border-color: #4a8cff; }

    button {
      flex: 0 0 auto;
      height: 24px;
      padding: 0 11px;
      border: 0;
      border-radius: calc(6px * var(--corner-scale));
      background: rgb(255 255 255 / 0.1);
      color: inherit;
      font: inherit;
      cursor: default;
    }

    button:hover { background: rgb(255 255 255 / 0.16); }
    .primary { background: #d97757; color: #fff; font-weight: 600; }
    .primary:hover { background: #c76a4c; }
    .quiet { color: var(--ink-quiet); font-size: 10.5px; }
    .error { color: #f0883e; }
  </style>
</head>
<body>
  <h1>Claude usage</h1>
  <div id="rows"></div>

  <form id="paste" hidden>
    <div class="line">
      <input id="code" type="text" spellcheck="false" autocomplete="off"
             placeholder="Paste the code" aria-label="Claude sign-in code" />
      <button class="primary" type="submit">OK</button>
    </div>
    <span class="error" role="alert"></span>
  </form>

  <button id="disconnect" hidden>Disconnect Account</button>

  <script type="module">
    import { USAGE_WINDOWS, elapsedFraction, rampFor, resetLabel } from './format.js';

    const rows = document.getElementById('rows');
    const paste = document.getElementById('paste');
    const disconnect = document.getElementById('disconnect');
    const code = document.getElementById('code');
    const error = paste.querySelector('.error');

    const LABELS = {
      fiveHour: '5-hour', sevenDay: '7-day',
      sevenDayOpus: '7-day Opus', sevenDaySonnet: '7-day Sonnet',
    };

    // The window is sized by what it drew, so a state with two rows is not a panel with four. Off
    // the body, because the root's scrollHeight is never less than the window: it could only grow.
    const fit = () => window.ct.call('usage:height', {
      height: Math.ceil(document.body.getBoundingClientRect().height),
    });

    const isConnected = (account) => Boolean(account.connected) && !account.needsReauth;

    function render(account) {
      const connected = isConnected(account);
      const readings = Object.entries(LABELS)
        .map(([key, label]) => [key, label, account[key]])
        .filter(([, , reading]) => reading);

      rows.replaceChildren(...readings.map(([key, label, reading]) => row(key, label, reading)));
      if (connected && !readings.length) rows.append(quiet('No reading yet.'));
      if (!connected) {
        rows.append(quiet(account.needsReauth
          ? 'That grant expired. Approve again in the browser, then paste the code.'
          : 'Approve in the browser, then paste the code.'));
      }

      paste.hidden = connected;
      disconnect.hidden = !connected;
      fit();
    }

    function row(key, label, reading) {
      const node = document.createElement('div');
      node.className = 'row';
      node.innerHTML = '<div class="head"><span></span><span class="reset quiet"></span></div>'
        + '<div class="track"><div class="fill"></div></div>';
      node.querySelector('.head span').textContent = `${label}  ${Math.round(reading.utilization)}%`;
      node.querySelector('.reset').textContent = resetLabel(reading.resetsAt, window.ct.hourCycle);
      const fill = node.querySelector('.fill');
      fill.style.width = `${reading.utilization}%`;
      fill.style.background = rampFor(reading.utilization);

      const usageWindow = USAGE_WINDOWS[key];
      const track = node.querySelector('.track');
      for (let unit = 1; unit < usageWindow.units; unit++) {
        track.append(marker('gap', unit / usageWindow.units));
      }
      const elapsed = elapsedFraction(usageWindow, reading);
      if (elapsed !== null) track.append(marker('now', elapsed));
      return node;
    }

    function marker(className, at) {
      const node = document.createElement('span');
      node.className = className;
      node.style.setProperty('--at', at);
      return node;
    }

    function quiet(text) {
      const node = document.createElement('div');
      node.className = 'quiet';
      node.textContent = text;
      return node;
    }

    paste.addEventListener('submit', async (event) => {
      event.preventDefault();
      error.textContent = '';
      const result = await window.ct.call('usage:code', { code: code.value });
      if (result?.ok) return void window.close();
      error.textContent = result?.error || 'Sign-in failed.';
      fit();
    });

    disconnect.addEventListener('click', async () => {
      await window.ct.call('usage:disconnect');
      window.close();
    });

    document.addEventListener('keydown', (event) => {
      if (event.key === 'Escape') window.close();
    });

    // With no account there is nothing to show but the way to connect one, so opening the panel
    // takes it: the consent page opens in the browser you are already signed into, and prints the
    // code this field is waiting for.
    const account = await window.ct.call('usage:state');
    render(account);
    if (!isConnected(account)) {
      code.focus();
      await window.ct.call('usage:connect');
    }
  </script>
</body>
</html>
