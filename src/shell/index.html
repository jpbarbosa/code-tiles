<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Code Tiles</title>
  <link rel="stylesheet" href="shell.css" />
</head>
<body>
  <header id="strip">
    <div id="lights"></div>
    <div id="view-control" role="group" aria-label="View">
      <button class="segment" data-mode="grid" aria-pressed="true" title="Grid (⌃⌘G)">
        <svg viewBox="0 0 16 16" aria-hidden="true"><rect x="1.5" y="1.5" width="5.5" height="5.5" rx="1.5"/><rect x="9" y="1.5" width="5.5" height="5.5" rx="1.5"/><rect x="1.5" y="9" width="5.5" height="5.5" rx="1.5"/><rect x="9" y="9" width="5.5" height="5.5" rx="1.5"/></svg>
      </button>
      <button class="segment" data-mode="single" aria-pressed="false" title="Single project (⌃⌘E)">
        <svg viewBox="0 0 16 16" aria-hidden="true"><rect x="1.5" y="1.5" width="13" height="13" rx="2"/></svg>
      </button>
    </div>
    <nav id="chips" aria-label="Projects"></nav>
    <button id="add" title="Open a project (⌃⌘O)" aria-label="Open a project">+</button>

    <div id="right">
      <button id="usage" data-connected="false" aria-label="Claude usage">
        <span class="offer">Connect Claude</span>
        <span class="bars">
          <span class="tag">5h</span><span class="bar"><span class="fill"></span></span>
          <span class="tag">7d</span><span class="bar"><span class="fill"></span></span>
        </span>
      </button>

      <!-- The one row that is not this app's own: the same three controls VS Code puts at the
           right of its title bar, driving the same three parts, in every open tile at once. The
           paths are its own codicon pair per part, the filled half being the state. -->
      <div id="layout-control" role="group" aria-label="Layout in every project">
        <button class="part" data-part="sideBar" aria-pressed="false"
                title="Side bar in every project (⌘B)" aria-label="Side bar in every project">
          <svg viewBox="0 0 16 16" aria-hidden="true">
            <path class="on" d="M12.48 1.01Q13.55 1.01 14.27 1.73Q14.99 2.45 14.99 3.52V12.48Q14.99 13.55 14.27 14.27Q13.55 14.99 12.48 14.99H3.52Q2.45 14.99 1.73 14.27Q1.01 13.55 1.01 12.48V3.52Q1.01 2.45 1.73 1.73Q2.45 1.01 3.52 1.01ZM12.48 13.97Q13.12 13.97 13.57 13.55Q14.03 13.12 13.97 12.48V3.52Q14.03 2.88 13.57 2.45Q13.12 2.03 12.48 2.03H6.99V13.97Z"/>
            <path class="off" d="M1.01 3.52V12.48Q1.01 13.55 1.73 14.27Q2.45 14.99 3.52 14.99H12.48Q13.55 14.99 14.27 14.27Q14.99 13.55 14.99 12.48V3.52Q14.99 2.45 14.27 1.73Q13.55 1.01 12.48 1.01H3.52Q2.45 1.01 1.73 1.73Q1.01 2.45 1.01 3.52ZM12.48 13.97H6.99V1.97H12.48Q13.12 1.97 13.57 2.43Q14.03 2.88 14.03 3.52V12.48Q14.03 13.12 13.57 13.55Q13.12 13.97 12.48 13.97ZM2.03 3.52Q2.03 2.88 2.45 2.43Q2.88 1.97 3.52 1.97H6.03V13.97H3.52Q2.88 13.97 2.45 13.55Q2.03 13.12 2.03 12.48Z"/>
          </svg>
        </button>
        <button class="part" data-part="panel" aria-pressed="false"
                title="Panel in every project (⌘J)" aria-label="Panel in every project">
          <svg viewBox="0 0 16 16" aria-hidden="true">
            <path class="on" d="M14.99 12.48Q14.99 13.55 14.27 14.27Q13.55 14.99 12.48 14.99H3.52Q2.45 14.99 1.73 14.27Q1.01 13.55 1.01 12.48V3.52Q1.01 2.45 1.73 1.73Q2.45 1.01 3.52 1.01H12.48Q13.55 1.01 14.27 1.73Q14.99 2.45 14.99 3.52ZM2.03 9.97H14.03V3.52Q14.03 2.88 13.57 2.45Q13.12 2.03 12.48 2.03H3.52Q2.88 1.97 2.45 2.43Q2.03 2.88 1.97 3.52V9.97Z"/>
            <path class="off" d="M12.48 1.01H3.52Q2.45 1.01 1.73 1.73Q1.01 2.45 1.01 3.52V12.48Q1.01 13.55 1.73 14.27Q2.45 14.99 3.52 14.99H12.48Q13.55 14.99 14.27 14.27Q14.99 13.55 14.99 12.48V3.52Q14.99 2.45 14.27 1.73Q13.55 1.01 12.48 1.01ZM14.03 12.48Q14.03 13.12 13.57 13.55Q13.12 13.97 12.48 13.97H3.52Q2.88 13.97 2.45 13.55Q2.03 13.12 2.03 12.48V10.99H14.03ZM14.03 9.97H2.03V3.52Q2.03 2.88 2.45 2.43Q2.88 1.97 3.52 1.97H12.48Q13.12 1.97 13.57 2.43Q14.03 2.88 14.03 3.52Z"/>
          </svg>
        </button>
        <button class="part" data-part="secondarySideBar" aria-pressed="false"
                title="Secondary side bar in every project (⌥⌘B)" aria-label="Secondary side bar in every project">
          <svg viewBox="0 0 16 16" aria-hidden="true">
            <path class="on" d="M12.48 1.01Q13.55 1.01 14.27 1.73Q14.99 2.45 14.99 3.52V12.48Q14.99 13.55 14.27 14.27Q13.55 14.99 12.48 14.99H3.52Q2.45 14.99 1.73 14.27Q1.01 13.55 1.01 12.48V3.52Q1.01 2.45 1.73 1.73Q2.45 1.01 3.52 1.01ZM9.01 13.97V1.97H3.52Q2.88 1.97 2.45 2.43Q2.03 2.88 1.97 3.52V12.48Q2.03 13.12 2.45 13.57Q2.88 14.03 3.52 14.03H9.01Z"/>
            <path class="off" d="M12.48 1.01H3.52Q2.45 1.01 1.73 1.73Q1.01 2.45 1.01 3.52V12.48Q1.01 13.55 1.73 14.27Q2.45 14.99 3.52 14.99H12.48Q13.55 14.99 14.27 14.27Q14.99 13.55 14.99 12.48V3.52Q14.99 2.45 14.27 1.73Q13.55 1.01 12.48 1.01ZM2.03 12.48V3.52Q2.03 2.88 2.45 2.43Q2.88 1.97 3.52 1.97H9.01V13.97H3.52Q2.88 13.97 2.45 13.55Q2.03 13.12 2.03 12.48ZM14.03 12.48Q14.03 13.12 13.57 13.55Q13.12 13.97 12.48 13.97H10.03V1.97H12.48Q13.12 1.97 13.57 2.43Q14.03 2.88 14.03 3.52Z"/>
          </svg>
        </button>
      </div>
    </div>
  </header>

  <main id="stage">
    <div id="glow" hidden></div>
    <section id="empty">
      <p>No projects open.</p>
      <button id="empty-add">Open a project</button>
    </section>
  </main>

  <script type="module" src="shell.js"></script>
</body>
</html>
