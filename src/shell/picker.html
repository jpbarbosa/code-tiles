<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Open a project</title>
  <!-- Its own window, over the stage, so it carries its own style rather than pulling the strip's
       in. The colours are the usage panel's, which is the other window this app draws. -->
  <style>
    :root {
      color-scheme: dark;
      --panel: #232325;
      --ink: #d6d6d8;
      --ink-quiet: #8b8b90;
    }

    /* Content-box would make the panel's own padding and border 18px MORE than the 560 below, so
       a window narrower than the panel would overflow rather than fit. */
    * { box-sizing: border-box; }

    body {
      margin: 0;
      height: 100vh;
      color: var(--ink);
      font: 12px/1.2 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
      user-select: none;
      cursor: default;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 40px 24px 24px;
    }

    /* The scrim is an ELEMENT and not the body's background, which is the whole difference
       between dimming the grid and not. A background on the body propagates to the root canvas,
       and this window is transparent, so the canvas is forced clear and the propagated colour is
       never painted: the opaque panel showed over the tiles while the dim did not.
       No backdrop-filter either - the grid is in another window, so there is nothing of it in
       this one's backdrop to blur. */
    #scrim {
      position: fixed;
      inset: 0;
      background: rgb(0 0 0 / 0.55);
      /* The window is square so its top edge covers the stage's corners; its bottom edge sits on
         the parent's own rounded ones, and 55% black painted into those would show outside the
         window's silhouette. This is the system's window radius, which nothing here can read, so
         it errs LARGE on purpose: too big leaves a couple of undimmed pixels in a gutter corner,
         too small paints a dark nub on the desktop. */
      border-radius: 0 0 14px 14px;
    }

    #panel {
      /* Over the scrim, which is its sibling rather than its parent. */
      position: relative;
      display: flex;
      flex-direction: column;
      width: min(560px, 100%);
      max-height: 100%;
      padding: 8px;
      border-radius: 12px;
      background: var(--panel);
      border: 1px solid rgb(255 255 255 / 0.08);
      box-shadow: 0 18px 48px rgb(0 0 0 / 0.55);
    }

    header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 4px 6px 8px 10px;
    }

    h1 {
      flex: 1 1 auto;
      margin: 0;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.2px;
      color: var(--ink-quiet);
    }

    button {
      border: 0;
      background: transparent;
      color: inherit;
      font: inherit;
      cursor: default;
    }

    #dismiss {
      flex: 0 0 auto;
      width: 20px;
      height: 20px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      border-radius: 4px;
      color: var(--ink-quiet);
      font-size: 14px;
      line-height: 1;
    }

    #list {
      flex: 0 1 auto;
      overflow-y: auto;
      min-height: 0;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    /* One shape for a project and for the folder dialog under it: both are things you open, and
       the dialog is the last row of the same list rather than a footer to it. */
    .row,
    #browse {
      display: flex;
      align-items: center;
      width: 100%;
      height: 40px;
      border-radius: 8px;
    }

    .row:hover,
    #browse:hover,
    .row:has(.choose:focus-visible),
    #browse:focus-visible { background: rgb(255 255 255 / 0.07); }

    /* The first row takes the focus so Return opens it, and the browser's own ring on a button
       that size reads as a selection nobody made. Ours is the hover plate and a hairline in the
       panel's own border colour. */
    :focus-visible { outline: none; }

    .row:has(.choose:focus-visible),
    #browse:focus-visible,
    .forget:focus-visible,
    #dismiss:focus-visible {
      outline: 1px solid rgb(255 255 255 / 0.16);
      outline-offset: -1px;
    }

    .choose {
      flex: 1 1 auto;
      min-width: 0;
      display: flex;
      align-items: center;
      gap: 10px;
      height: 100%;
      padding: 0 4px 0 10px;
      text-align: left;
    }

    /* Both marks sit in one 20px box, so a project with a favicon and one without line up. */
    .choose img,
    .choose .monogram {
      flex: 0 0 auto;
      width: 20px;
      height: 20px;
      border-radius: 5px;
    }

    .choose .monogram {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 11px;
      font-weight: 600;
      line-height: 1;
    }

    /* The name is what you read and the path is what tells two folders of the same name apart, so
       they share a line and the path is what gives way. NOT direction: rtl to truncate a path from
       the left: a path starts with weak characters, and bidi reorders ~/Sites/x to Sites/x/~. */
    .choose .name {
      flex: 0 0 auto;
      max-width: 55%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .choose .path {
      flex: 1 1 auto;
      min-width: 0;
      color: var(--ink-quiet);
      font-size: 11.5px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .row .open {
      flex: 0 0 auto;
      margin-right: 8px;
      padding: 2px 6px;
      border-radius: 4px;
      background: rgb(255 255 255 / 0.1);
      color: var(--ink-quiet);
      font-size: 10px;
      letter-spacing: 0.3px;
    }

    /* Forgetting a row must not sit in the way of the click that opens it, which is what every row
       is for. Hidden until the pointer or the keyboard is on the row - hover alone would leave it
       unreachable for anyone tabbing through. */
    .row .forget {
      flex: 0 0 auto;
      width: 20px;
      height: 20px;
      margin-right: 6px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 4px;
      color: var(--ink-quiet);
      font-size: 13px;
      line-height: 1;
      opacity: 0;
    }

    .row:hover .forget,
    .forget:focus-visible { opacity: 1; }

    #dismiss:hover,
    .forget:hover { color: var(--ink); background: rgb(255 255 255 / 0.14); }

    #browse {
      flex: 0 0 auto;
      gap: 10px;
      margin-top: 4px;
      padding: 0 8px 0 10px;
      border-top: 1px solid rgb(255 255 255 / 0.07);
      border-radius: 0 0 8px 8px;
      text-align: left;
    }

    #browse .glyph { flex: 0 0 auto; display: inline-flex; width: 20px; justify-content: center; color: var(--ink-quiet); }
    #browse .label { flex: 1 1 auto; }
    #browse .chord { flex: 0 0 auto; color: var(--ink-quiet); font-size: 11px; }

    #none { padding: 18px 10px; color: var(--ink-quiet); text-align: center; }
    [hidden] { display: none; }
  </style>
</head>
<body>
  <div id="scrim"></div>

  <div id="panel" role="dialog" aria-modal="true" aria-label="Open a project">
    <header>
      <h1>Open a project</h1>
      <button id="dismiss" type="button" aria-label="Close">×</button>
    </header>

    <ul id="list"></ul>
    <p id="none" hidden>No projects opened yet.</p>

    <button id="browse" type="button">
      <span class="glyph" aria-hidden="true">
        <svg width="16" height="16" viewBox="0 0 16 16">
          <path d="M1.6 12.4V3.6a1 1 0 0 1 1-1h3.2l1.4 1.6h5.2a1 1 0 0 1 1 1v7.2a1 1 0 0 1-1 1H2.6a1 1 0 0 1-1-1Z"
                fill="none" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round" />
        </svg>
      </span>
      <span class="label">Open folder...</span>
      <span class="chord">⌃⌘O</span>
    </button>
  </div>

  <script type="module">
    import { projectMark } from './format.js';

    const list = document.getElementById('list');
    const none = document.getElementById('none');

    const call = (type, payload) => window.ct.call(type, payload);

    function render(rows) {
      list.replaceChildren(...rows.map(row));
      none.hidden = rows.length > 0;
      list.querySelector('.choose')?.focus();
    }

    function row(project) {
      const item = document.createElement('li');
      item.className = 'row';

      const choose = document.createElement('button');
      choose.type = 'button';
      choose.className = 'choose';
      choose.title = project.folder;
      choose.append(projectMark(project), span('name', project.name), span('path', project.short));
      // An open project is a tile you already have, so it takes the focus rather than a second
      // copy of itself. The app's own list makes opening one that is already open the same thing,
      // but only this way clears a turn that finished while you were looking elsewhere.
      choose.addEventListener('click', async () => {
        await call(project.open ? 'project:focus' : 'project:open', { folder: project.folder });
        window.close();
      });
      item.append(choose);

      if (project.open) {
        item.append(span('open', 'OPEN'));
        return item;
      }

      const forget = document.createElement('button');
      forget.type = 'button';
      forget.className = 'forget';
      forget.textContent = '×';
      forget.title = 'Remove from this list';
      forget.setAttribute('aria-label', `Remove ${project.name} from this list`);
      forget.addEventListener('click', async () => {
        await call('project:forget', { folder: project.folder });
        item.remove();
        none.hidden = list.children.length > 0;
      });
      item.append(forget);
      return item;
    }

    function span(className, text) {
      const node = document.createElement('span');
      node.className = className;
      node.textContent = text;
      return node;
    }

    document.getElementById('browse').addEventListener('click', () => call('project:browse'));
    document.getElementById('dismiss').addEventListener('click', () => window.close());

    // Anywhere off the panel is the scrim, which is a dismissal like any other sheet's.
    document.addEventListener('click', (event) => {
      if (!event.target.closest('#panel')) window.close();
    });

    document.addEventListener('keydown', (event) => {
      if (event.key === 'Escape') window.close();
    });

    render(await call('picker:list'));
  </script>
</body>
</html>
